<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="fav-top" x1="10" y1="5" x2="55" y2="25" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FD71D9" />
      <stop offset="100%" stop-color="#9333EA" />
    </linearGradient>
    <linearGradient id="fav-spine" x1="10" y1="15" x2="25" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F776E0" />
      <stop offset="50%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="fav-bottom" x1="10" y1="45" x2="55" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="fav-stroke" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
  </defs>
  <!-- Background rounded plate -->
  <rect width="64" height="64" rx="16" fill="#050003" />
  <rect width="64" height="64" rx="16" fill="none" stroke="rgba(247, 118, 224, 0.3)" stroke-width="1.5" />
  
  <!-- Clevion Faceted Prism C -->
  <g transform="translate(6, 6) scale(0.43)">
    <!-- Top Roof -->
    <polygon points="60,12 98,34 80,44 42,22" fill="url(#fav-top)" />
    <polygon points="98,34 98,52 82,43 82,25" fill="#C084FC" />
    
    <!-- Spine -->
    <polygon points="22,34 60,12 42,22 22,34" fill="#FD71D9" />
    <polygon points="22,34 42,22 42,98 22,86" fill="url(#fav-spine)" />
    
    <!-- Bottom Floor -->
    <polygon points="98,68 98,86 82,95 82,77" fill="#0284C7" />
    <polygon points="60,108 98,86 80,76 42,98" fill="url(#fav-bottom)" />
    <polygon points="22,86 60,108 42,98 22,86" fill="#0369A1" />

    <!-- Outer titanium edges -->
    <polyline points="98,34 60,12 22,34 22,86 60,108 98,86" fill="none" stroke="url(#fav-stroke)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <polyline points="98,52 80,42 80,34 60,22 34,37 34,83 60,98 80,86 80,78 98,68" fill="none" stroke="url(#fav-stroke)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

    <circle cx="60" cy="12" r="3.5" fill="#FFFFFF" />
    <circle cx="60" cy="108" r="3.5" fill="#38BDF8" />
  </g>
</svg>
