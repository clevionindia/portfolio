<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none" width="100%" height="100%">
  <defs>
    <!-- Radiant Fuchsia to Violet (Top Facet) -->
    <linearGradient id="clevion-grad-top" x1="20" y1="10" x2="100" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FD71D9" />
      <stop offset="50%" stop-color="#F776E0" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <!-- Deep Electric Violet to Orchid (Spine) -->
    <linearGradient id="clevion-grad-spine" x1="10" y1="30" x2="50" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F776E0" />
      <stop offset="40%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Vibrant Cyan to Electric Cobalt (Bottom Facet) -->
    <linearGradient id="clevion-grad-bottom" x1="20" y1="80" x2="100" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9333EA" />
      <stop offset="40%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Inner Refraction Core (Stage Prism Light) -->
    <linearGradient id="clevion-grad-inner" x1="30" y1="30" x2="85" y2="85" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDDEFF" stop-opacity="0.9" />
      <stop offset="45%" stop-color="#F776E0" stop-opacity="0.4" />
      <stop offset="85%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#E0F2FE" stop-opacity="0.9" />
    </linearGradient>

    <!-- Titanium Metallic Bevel Stroke -->
    <linearGradient id="clevion-titanium" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#CBD5E1" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#94A3B8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.8" />
    </linearGradient>

    <!-- Outer Ambient Glow Filter -->
    <filter id="clevion-glow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Glow Backing -->
  <path d="M 60 12 L 98 34 L 98 52 L 80 42 L 80 34 L 60 22 L 34 37 L 34 83 L 60 98 L 80 86 L 80 78 L 98 68 L 98 86 L 60 108 L 22 86 L 22 34 Z" 
        fill="url(#clevion-grad-spine)" opacity="0.4" filter="url(#clevion-glow)" />

  <!-- Outer Isometric Facets (The Architectural C) -->
  <!-- Top Roof Facet -->
  <polygon points="60,12 98,34 80,44 42,22" fill="url(#clevion-grad-top)" />
  
  <!-- Top Return / Inward Arm -->
  <polygon points="98,34 98,52 82,43 82,25" fill="#C084FC" opacity="0.85" />
  
  <!-- Outer Left Spine (Vertical Mainstage Wall) -->
  <polygon points="22,34 60,12 42,22 22,34" fill="#FD71D9" />
  <polygon points="22,34 42,22 42,98 22,86" fill="url(#clevion-grad-spine)" />
  
  <!-- Inner Facet Wall (Reflective Scenography Chamber) -->
  <polygon points="42,22 80,44 80,76 42,98" fill="url(#clevion-grad-inner)" opacity="0.2" />
  <polygon points="42,32 72,49 72,71 42,88" fill="url(#clevion-grad-inner)" opacity="0.35" />

  <!-- Bottom Return / Inward Arm -->
  <polygon points="98,68 98,86 82,95 82,77" fill="#0284C7" opacity="0.85" />

  <!-- Bottom Floor Facet -->
  <polygon points="60,108 98,86 80,76 42,98" fill="url(#clevion-grad-bottom)" />
  <polygon points="22,86 60,108 42,98 22,86" fill="#0369A1" />

  <!-- Inner Architectural Step Cutout (Representing Stage Depth) -->
  <polygon points="42,38 68,53 68,67 42,82" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="2 2" />

  <!-- Titanium Precision Chamfer Lines -->
  <!-- Outer perimeter contour -->
  <polyline points="98,34 60,12 22,34 22,86 60,108 98,86" fill="none" stroke="url(#clevion-titanium)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Inner perimeter contour -->
  <polyline points="98,52 80,42 80,34 60,22 34,37 34,83 60,98 80,86 80,78 98,68" fill="none" stroke="url(#clevion-titanium)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Converging Apex Highlight Nodes -->
  <circle cx="60" cy="12" r="2.5" fill="#FFFFFF" />
  <circle cx="98" cy="34" r="2" fill="#FDDEFF" />
  <circle cx="60" cy="108" r="2.5" fill="#38BDF8" />
  <circle cx="98" cy="86" r="2" fill="#BAE6FD" />
</svg>
